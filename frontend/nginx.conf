server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由回退：所有前端路由都交给 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 部署状态文件不能被缓存，工作台要随时看到最新环节状态
    location = /deploy-state.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }
}
